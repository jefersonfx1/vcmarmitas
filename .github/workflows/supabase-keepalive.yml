name: Supabase Keep Alive

# Mantém o projeto Free do Supabase ativo (evita pausa por inatividade após ~7 dias)
on:
  schedule:
    # Segunda e Quinta às 12:00 UTC (≈ 09:00 Brasília)
    - cron: "0 12 * * 1,4"
  workflow_dispatch: # permite rodar manualmente em Actions → Run workflow

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Pinging Supabase to prevent project pause..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 500 ]; then
            echo "✅ Ping successful"
            exit 0
          else
            echo "❌ Ping failed with status $HTTP_CODE"
            exit 1
          fi
